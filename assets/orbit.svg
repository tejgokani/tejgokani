<svg width="900" height="520" viewBox="0 0 900 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="core" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#b8ffee"/>
      <stop offset="0.55" stop-color="#2affc9"/>
      <stop offset="1" stop-color="#0a5c48"/>
    </radialGradient>
    <filter id="oglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace; }
      .lbl { font-size: 13px; fill: #c9fff1; }
      .hud { font-size: 13px; fill: #59d9c0; letter-spacing: 2px; }
      .dim { font-size: 12px; fill: #2b6b5e; letter-spacing: 2px; }
      .pill { fill: #0a1512; stroke: #1d5a4e; stroke-width: 1.5; }
      .edge { stroke: #2affc9; stroke-opacity: 0.28; stroke-width: 1.2; stroke-dasharray: 3 7; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
      .ringline { stroke: #123832; stroke-width: 1.2; stroke-dasharray: 2 9; }
      .twinkle { animation: tw 3.4s ease-in-out infinite; }
      @keyframes tw { 0%,100% {opacity: 0.15;} 50% {opacity: 0.9;} }
      .blink { animation: blink 1s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
    </style>
  </defs>

  <rect width="900" height="520" fill="#04070a"/>
  <rect x="1" y="1" width="898" height="518" rx="14" stroke="#123832" stroke-width="2"/>

  <!-- stars -->
  <g fill="#7dffe8">
    <circle cx="80" cy="70" r="1.4" class="twinkle"/>
    <circle cx="190" cy="430" r="1.1" class="twinkle" style="animation-delay:-1.2s"/>
    <circle cx="120" cy="260" r="1.6" class="twinkle" style="animation-delay:-2.1s"/>
    <circle cx="300" cy="90" r="1.2" class="twinkle" style="animation-delay:-0.6s"/>
    <circle cx="620" cy="60" r="1.5" class="twinkle" style="animation-delay:-2.8s"/>
    <circle cx="760" cy="150" r="1.1" class="twinkle" style="animation-delay:-1.7s"/>
    <circle cx="830" cy="330" r="1.5" class="twinkle" style="animation-delay:-0.9s"/>
    <circle cx="700" cy="460" r="1.2" class="twinkle" style="animation-delay:-2.4s"/>
    <circle cx="420" cy="40" r="1.3" class="twinkle" style="animation-delay:-1.5s"/>
    <circle cx="520" cy="480" r="1.4" class="twinkle" style="animation-delay:-0.3s"/>
    <circle cx="60" cy="470" r="1.2" class="twinkle" style="animation-delay:-3s"/>
    <circle cx="850" cy="60" r="1.3" class="twinkle" style="animation-delay:-1s"/>
  </g>

  <!-- HUD -->
  <g>
    <circle cx="30" cy="32" r="4" fill="#2affc9" class="blink"/>
    <text x="44" y="37" class="hud">STACK.ORBIT — LIVE FEED</text>
    <text x="876" y="37" class="dim" text-anchor="end">12 BODIES · 3 RINGS</text>
    <text x="876" y="496" class="dim" text-anchor="end">GRAVITY: CURIOSITY</text>
    <text x="30" y="496" class="dim">EVERY NODE BATTLE-TESTED</text>
  </g>

  <g transform="translate(450,262)">
    <!-- ring guides -->
    <circle r="98" class="ringline" fill="none"/>
    <circle r="160" class="ringline" fill="none"/>
    <circle r="216" class="ringline" fill="none"/>

    <!-- core pulses -->
    <circle r="36" fill="none" stroke="#2affc9" stroke-width="2">
      <animate attributeName="r" from="36" to="92" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" from="0.6" to="0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="36" fill="none" stroke="#2affc9" stroke-width="2">
      <animate attributeName="r" from="36" to="92" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" from="0.6" to="0" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- core -->
    <circle r="36" fill="url(#core)" filter="url(#oglow)"/>
    <text y="6" text-anchor="middle" font-size="16" font-weight="700" fill="#032019">TEJ</text>

    <!-- RING 1 : 28s -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      <g transform="rotate(0)">
        <line x1="44" y1="0" x2="84" y2="0" class="edge"/>
        <g transform="translate(98 0)"><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
          <rect x="-53" y="-14" width="106" height="28" rx="14" class="pill"/><text y="5" text-anchor="middle" class="lbl">TypeScript</text>
        </g></g>
      </g>
      <g transform="rotate(90)">
        <line x1="44" y1="0" x2="84" y2="0" class="edge"/>
        <g transform="translate(98 0)"><g transform="rotate(-90)"><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
          <rect x="-32" y="-14" width="64" height="28" rx="14" class="pill"/><text y="5" text-anchor="middle" class="lbl">React</text>
        </g></g></g>
      </g>
      <g transform="rotate(180)">
        <line x1="44" y1="0" x2="84" y2="0" class="edge"/>
        <g transform="translate(98 0)"><g transform="rotate(-180)"><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
          <rect x="-41" y="-14" width="82" height="28" rx="14" class="pill"/><text y="5" text-anchor="middle" class="lbl">Node.js</text>
        </g></g></g>
      </g>
      <g transform="rotate(270)">
        <line x1="44" y1="0" x2="84" y2="0" class="edge"/>
        <g transform="translate(98 0)"><g transform="rotate(-270)"><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
          <rect x="-41" y="-14" width="82" height="28" rx="14" class="pill"/><text y="5" text-anchor="middle" class="lbl">Next.js</text>
        </g></g></g>
      </g>
    </g>

    <!-- RING 2 : 44s reverse -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="44s" repeatCount="indefinite"/>
      <g transform="rotate(45)">
        <line x1="108" y1="0" x2="146" y2="0" class="edge"/>
        <g transform="translate(160 0)"><g transform="rotate(-45)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="44s" repeatCount="indefinite"/>
          <rect x="-45" y="-14" width="90" height="28" rx="14" class="pill"/><text y="5" text-anchor="middle" class="lbl">Three.js</text>
        </g></g></g>
      </g>
      <g transform="rotate(135)">
        <line x1="108" y1="0" x2="146" y2="0" class="edge"/>
        <g transform="translate(160 0)"><g transform="rotate(-135)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="44s" repeatCount="indefinite"/>
          <rect x="-45" y="-14" width="90" height="28" rx="14" class="pill"/><text y="5" text-anchor="middle" class="lbl">Supabase</text>
        </g></g></g>
      </g>
      <g transform="rotate(225)">
        <line x1="108" y1="0" x2="146" y2="0" class="edge"/>
        <g transform="translate(160 0)"><g transform="rotate(-225)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="44s" repeatCount="indefinite"/>
          <rect x="-53" y="-14" width="106" height="28" rx="14" class="pill"/><text y="5" text-anchor="middle" class="lbl">PostgreSQL</text>
        </g></g></g>
      </g>
      <g transform="rotate(315)">
        <line x1="108" y1="0" x2="146" y2="0" class="edge"/>
        <g transform="translate(160 0)"><g transform="rotate(-315)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="44s" repeatCount="indefinite"/>
          <rect x="-45" y="-14" width="90" height="28" rx="14" class="pill"/><text y="5" text-anchor="middle" class="lbl">Tailwind</text>
        </g></g></g>
      </g>
    </g>

    <!-- RING 3 : 64s -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="64s" repeatCount="indefinite"/>
      <g transform="rotate(0)">
        <line x1="172" y1="0" x2="202" y2="0" class="edge"/>
        <g transform="translate(216 0)"><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="64s" repeatCount="indefinite"/>
          <rect x="-29" y="-14" width="58" height="28" rx="14" class="pill"/><text y="5" text-anchor="middle" class="lbl">Rust</text>
        </g></g>
      </g>
      <g transform="rotate(90)">
        <line x1="172" y1="0" x2="202" y2="0" class="edge"/>
        <g transform="translate(216 0)"><g transform="rotate(-90)"><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="64s" repeatCount="indefinite"/>
          <rect x="-37" y="-14" width="74" height="28" rx="14" class="pill"/><text y="5" text-anchor="middle" class="lbl">Python</text>
        </g></g></g>
      </g>
      <g transform="rotate(180)">
        <line x1="172" y1="0" x2="202" y2="0" class="edge"/>
        <g transform="translate(216 0)"><g transform="rotate(-180)"><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="64s" repeatCount="indefinite"/>
          <rect x="-45" y="-14" width="90" height="28" rx="14" class="pill"/><text y="5" text-anchor="middle" class="lbl">Security</text>
        </g></g></g>
      </g>
      <g transform="rotate(270)">
        <line x1="172" y1="0" x2="202" y2="0" class="edge"/>
        <g transform="translate(216 0)"><g transform="rotate(-270)"><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="64s" repeatCount="indefinite"/>
          <rect x="-41" y="-14" width="82" height="28" rx="14" class="pill"/><text y="5" text-anchor="middle" class="lbl">AI/LLMs</text>
        </g></g></g>
      </g>
    </g>
  </g>
</svg>
