<svg width="900" height="400" viewBox="0 0 900 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleFill" x1="450" y1="120" x2="450" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#9cffe9"/>
      <stop offset="1" stop-color="#2affc9"/>
    </linearGradient>
    <linearGradient id="shine" x1="-300" y1="0" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1250 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2affc9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2affc9" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#2affc9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace; }
      .title { font-family: 'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace; font-weight: 800; font-size: 82px; letter-spacing: 6px; }
      .flicker { animation: flicker 7s linear infinite; }
      @keyframes flicker {
        0%, 96.8%, 97.6%, 100% { opacity: 1; }
        97.2% { opacity: 0.55; }
        98.4% { opacity: 0.8; }
        98.8% { opacity: 1; }
      }
      .typeCover { animation: typeCover 12s linear infinite; }
      @keyframes typeCover {
        0%, 8% { transform: translateX(0); animation-timing-function: steps(58, end); }
        40%, 96% { transform: translateX(672px); }
        97%, 100% { transform: translateX(0); }
      }
      .blink { animation: blink 1s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
      .dash { stroke-dasharray: 6 8; animation: dashmove 1.6s linear infinite; }
      @keyframes dashmove { to { stroke-dashoffset: -28; } }
      .drift { animation: drift 3.2s ease-in-out infinite; }
      @keyframes drift { 0%,100% { opacity: 0.5; transform: translateY(0); } 50% { opacity: 1; transform: translateY(5px); } }
    </style>
  </defs>

  <!-- background -->
  <rect width="900" height="400" fill="#04070a"/>
  <g stroke="#0d2b26" stroke-width="1" opacity="0.45">
    <path d="M45 0V400M90 0V400M135 0V400M180 0V400M225 0V400M270 0V400M315 0V400M360 0V400M405 0V400M450 0V400M495 0V400M540 0V400M585 0V400M630 0V400M675 0V400M720 0V400M765 0V400M810 0V400M855 0V400"/>
    <path d="M0 45H900M0 90H900M0 135H900M0 180H900M0 225H900M0 270H900M0 315H900M0 360H900"/>
  </g>

  <!-- scanline sweep -->
  <rect x="0" y="-90" width="900" height="90" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 520" dur="6.5s" repeatCount="indefinite"/>
  </rect>

  <!-- rising particles -->
  <g fill="#2affc9">
    <circle r="1.8" opacity="0.7"><animateMotion path="M110,420 L130,-20" dur="9s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle r="1.2" opacity="0.5"><animateMotion path="M240,420 L232,-20" dur="12s" begin="-7s" repeatCount="indefinite"/></circle>
    <circle r="2.2" opacity="0.8"><animateMotion path="M370,420 L390,-20" dur="8s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle r="1.4" opacity="0.5"><animateMotion path="M520,420 L505,-20" dur="13s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle r="1.9" opacity="0.7"><animateMotion path="M650,420 L668,-20" dur="10s" begin="-6s" repeatCount="indefinite"/></circle>
    <circle r="1.3" opacity="0.5"><animateMotion path="M780,420 L770,-20" dur="11s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle r="1.6" opacity="0.6"><animateMotion path="M845,420 L860,-20" dur="9.5s" begin="-8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- HUD corners -->
  <g stroke="#2affc9" stroke-width="2" class="pulse">
    <path d="M14 40V14H40"/>
    <path d="M860 14H886V40"/>
    <path d="M886 360V386H860"/>
    <path d="M40 386H14V360"/>
  </g>

  <!-- status chip -->
  <g class="mono" font-size="13">
    <circle cx="36" cy="35" r="4" fill="#2affc9" class="blink"/>
    <text x="50" y="40" fill="#59d9c0" letter-spacing="2">PROFILE.SYS — ONLINE</text>
    <text x="886" y="40" fill="#2b6b5e" letter-spacing="2" text-anchor="end">v5.0 // EARTH-1</text>
  </g>

  <!-- title -->
  <g class="flicker">
    <text x="450" y="190" text-anchor="middle" class="title" fill="url(#titleFill)" filter="url(#glow)">TEJ GOKANI</text>
    <text x="450" y="190" text-anchor="middle" class="title" fill="url(#shine)" opacity="0.7">TEJ GOKANI</text>
  </g>

  <!-- divider -->
  <line x1="180" y1="216" x2="720" y2="216" stroke="#1d5a4e" stroke-width="2" class="dash"/>

  <!-- typed subtitle -->
  <clipPath id="subclip"><rect x="118" y="240" width="678" height="32"/></clipPath>
  <g class="mono" font-size="19">
    <text x="120" y="262" fill="#a9fdea" textLength="670" lengthAdjust="spacingAndGlyphs">security tools developer × open source security maintainer</text>
    <g clip-path="url(#subclip)">
      <rect x="118" y="242" width="680" height="28" fill="#04070a" class="typeCover"/>
    </g>
    <g class="typeCover">
      <rect x="120" y="245" width="11" height="22" fill="#2affc9" class="blink"/>
    </g>
  </g>

  <!-- footer hint -->
  <g class="mono" font-size="12" text-anchor="middle">
    <text x="450" y="345" fill="#2b6b5e" letter-spacing="3" class="drift">SCROLL FOR LIVE SYSTEMS ▾</text>
  </g>

  <!-- vignette -->
  <rect width="900" height="400" fill="url(#vignette)"/>
  <rect x="1" y="1" width="898" height="398" rx="14" stroke="#123832" stroke-width="2"/>
</svg>
